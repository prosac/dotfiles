# Pre-commit hooks for the dotfiles repo.
# Goal: no secret material ever lands in this public repo.
#
# Install once per clone with: pre-commit install
# Run manually:               pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged changes)
        description: Scan staged changes for secrets before commit.
        entry: gitleaks git --staged --verbose --redact
        language: system
        pass_filenames: false
      - id: handover-tests
        name: handover (script tests)
        description: The handover tool edits frontmatter and deletes docs; its guards need tests.
        entry: python3 tests/test_handover.py
        language: system
        pass_filenames: false
        files: '^(dot_local/bin/executable_handover|tests/test_handover\.py)$'
