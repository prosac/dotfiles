# Global mise config — tasks available from any cwd.
# Managed by chezmoi: edit the live file, then `mise run ch:readd`.

# Namespacing:
#   ch:*   chezmoi workflows
#   dots:* dotfile change-review / snapshot tooling (coming)

# mise's go tool exports GOBIN=$GOROOT/bin, a version-pinned dir that is NOT on
# PATH (and is wiped on every Go upgrade). Redirect `go install` output to the
# conventional $GOPATH/bin, which IS on PATH.
[env]
GOBIN = "{{env.HOME}}/.local/go/bin"

[tasks."ch:test"]
description = "Run the tests for the scripts in the chezmoi source (handover, …)"
dir = "{{env.HOME}}/.local/share/chezmoi"
run = "python3 tests/test_handover.py"

[tasks."ch:status"]
description = "Show chezmoi drift (source vs target)"
run = "chezmoi status"

[tasks."ch:diff"]
description = "Show pending chezmoi changes"
run = "chezmoi diff"

[tasks."ch:apply"]
description = "Apply source state to target"
run = "chezmoi apply"

[tasks."ch:readd"]
description = "Capture target edits into source (use after editing live configs)"
run = "chezmoi re-add"

[tasks."ch:managed"]
description = "List files managed by chezmoi"
run = "chezmoi managed"

[tasks."ch:unmanaged"]
description = "List files in target home that are NOT managed by chezmoi"
run = "chezmoi unmanaged --path-style=absolute"

[tasks."ch:cd"]
description = "Print the chezmoi source path"
run = "chezmoi source-path"

[tasks."ch:git"]
description = 'Run git in the chezmoi source repo (mise run ch:git -- status)'
run = 'chezmoi git -- {{arg(name="args", var=true)}}'

[tasks."ch:sync"]
description = "Pull source repo and apply"
run = "chezmoi git -- pull --rebase && chezmoi apply"

[tasks."ch:commit"]
description = "Stage all source changes and commit (mise run ch:commit -- 'commit msg')"
run = 'chezmoi git -- add -A && chezmoi git -- commit -m {{arg(name="msg")}}'

[tasks."ch:push"]
description = "Stage all source changes, commit, and push (mise run ch:push -- 'commit msg')"
run = 'chezmoi git -- add -A && chezmoi git -- commit -m {{arg(name="msg")}} && chezmoi git -- push'

[tasks."ch:scan"]
description = "Scan the chezmoi source repo for secrets (gitleaks)"
run = 'gitleaks git --verbose --redact "$(chezmoi source-path)"'

[tasks."ch:hooks"]
description = "Install pre-commit hooks into the chezmoi source repo"
run = '(cd "$(chezmoi source-path)" && pre-commit install)'

# --- dotfile snapshot review ---

[tasks."dots:snap"]
description = "Create a btrfs snapshot of /home now (manual)"
run = "dotsnap"

[tasks."dots:snaps"]
description = "List dotfile snapshots, oldest first"
run = "ls -1 /home/.snapshots/hourly/ | sort"

[tasks."dots:latest"]
description = "Print path to the most recent snapshot"
run = "ls -1 /home/.snapshots/hourly/ | sort | tail -1 | sed 's|^|/home/.snapshots/hourly/|'"

[tasks."dots:review"]
description = "Show dotfile drift since latest snapshot (optional: snapshot name)"
run = "dotreview"

# --- one-time per-machine setup ---

[tasks."bootstrap:sudoers"]
description = "Install /etc/sudoers.d/dotsnap (renders the template, asks for sudo)"
run = '''
set -e
src="$(chezmoi source-path)/bootstrap/sudoers/dotsnap.tmpl"
rendered="$(mktemp)"
trap 'rm -f "$rendered"' EXIT
chezmoi execute-template < "$src" > "$rendered"

# The rule uses sudoers regexes, which need sudo >= 1.9.10. On anything older
# visudo rejects the file -- which is why the check below runs BEFORE the
# install, not after: a rejected file that is already in /etc/sudoers.d/ breaks
# every subsequent sudo call, including the one that would remove it.
ver=$(sudo -V | sed -n '1s/.*version \([0-9.]*\).*/\1/p')
if [ "$(printf '%s\n1.9.10\n' "$ver" | sort -V | head -1)" != "1.9.10" ]; then
  echo "ERROR: sudo $ver is too old for sudoers regexes (need >= 1.9.10)." >&2
  echo "       See the header in bootstrap/sudoers/dotsnap.tmpl." >&2
  exit 1
fi

# Validate the RENDERED file first, then install a file already known good.
visudo -cf "$rendered"
sudo install -m 440 -o root -g root "$rendered" /etc/sudoers.d/dotsnap
echo "Installed: /etc/sudoers.d/dotsnap"

# Assert the rule is not just syntactically valid but scoped as intended. The
# form this replaced (`/home/.snapshots/hourly/*`) permitted BOTH of these,
# because sudoers matches arguments as one concatenated string in which a
# wildcard also matches spaces and slashes -- so an extra subvolume could be
# appended and deleted as root. Test the deny case, not only the allow case:
# a rule that permits everything passes an allow-only check.
echo "==> Verifying rule scope (queried from sudo, not read from the file):"
good="/home/.snapshots/hourly/2026-01-01-0000"
if sudo -l /usr/sbin/btrfs subvolume delete "$good" >/dev/null 2>&1; then
  echo "  allow  legitimate snapshot delete            : yes"
else
  echo "  allow  legitimate snapshot delete            : NO -- dotsnap will fail to prune" >&2
  exit 1
fi
if sudo -l /usr/sbin/btrfs subvolume delete "$good" /swap >/dev/null 2>&1; then
  echo "  deny   appended extra subvolume (/swap)      : NO -- RULE IS TOO BROAD" >&2
  exit 1
else
  echo "  deny   appended extra subvolume (/swap)      : yes"
fi
if sudo -l /usr/sbin/btrfs subvolume delete /home/.snapshots/hourly/../../../swap >/dev/null 2>&1; then
  echo "  deny   path traversal out of hourly/         : NO -- RULE IS TOO BROAD" >&2
  exit 1
else
  echo "  deny   path traversal out of hourly/         : yes"
fi
'''

[tasks."bootstrap:tmpfiles"]
description = "Install /etc/tmpfiles.d/dotsnap.conf and create the snapshot tree (asks for sudo)"
run = '''
set -e
src="$(chezmoi source-path)/bootstrap/tmpfiles/dotsnap.conf.tmpl"
rendered="$(mktemp)"
chezmoi execute-template < "$src" > "$rendered"
sudo install -m 644 -o root -g root "$rendered" /etc/tmpfiles.d/dotsnap.conf
rm -f "$rendered"
sudo systemd-tmpfiles --create /etc/tmpfiles.d/dotsnap.conf
echo "Installed: /etc/tmpfiles.d/dotsnap.conf"
# inode 256 is the root of a btrfs subvolume; anything else means tmpfiles fell
# back to a plain directory (see the comments in the template).
if [ "$(stat -c %i /home/.snapshots)" = "256" ]; then
  echo "/home/.snapshots is a btrfs subvolume (excluded from /home snapshots)"
else
  echo "WARNING: /home/.snapshots is a plain directory, not a subvolume" >&2
fi
'''

[tasks."bootstrap:pam-u2f"]
description = "Install /etc/security/pam_u2f.conf, then enable authselect with-pam-u2f -- in that order (asks for sudo)"
run = '''
set -e

# BOTH HALVES LIVE IN ONE TASK BECAUSE THE ORDER IS LOAD-BEARING. The config file
# must exist BEFORE the PAM line does. pam_u2f reads /etc/security/pam_u2f.conf on
# every invocation and `userverification = 1` lives only there (it cannot go on the
# PAM line -- authselect regenerates that and drops hand-added options). Enable the
# feature first and you get a window -- or, if the second step is forgotten, a
# permanent state -- where pam_u2f is live with the authenticator's DEFAULT
# behaviour: a bare touch authenticates, so mere possession of the key is enough.
#
# ⚠️ ASSERT THE MODULE EXISTS FIRST. pam_u2f is `sufficient` in every stack it
# appears in, so a missing module does not fail the stack -- it silently falls
# through to fingerprint or password. Fedora splits the module (`pam-u2f`) from the
# enrolment tool (`pamu2fcfg`); both are in .chezmoidata/packages.yaml now, but a
# machine provisioned before that entry has neither, and the only evidence is one
# journal line per unlock:
#     PAM unable to dlopen(/usr/lib64/security/pam_u2f.so)
# The second laptop ran that way from its F44 rebuild until 2026-10-01 (96 lines in one week).
# Refuse rather than configure a stack around an absent module.
if [ ! -f /usr/lib64/security/pam_u2f.so ]; then
  echo "pam_u2f.so is NOT installed -- refusing to configure a stack around it." >&2
  echo "  sudo dnf install -y pam-u2f pamu2fcfg" >&2
  exit 1
fi
command -v pamu2fcfg >/dev/null 2>&1 || echo "⚠️  pamu2fcfg missing -- enrolment will be impossible (sudo dnf install -y pamu2fcfg)"

src="$(chezmoi source-path)/bootstrap/pam/pam_u2f.conf"
sudo install -m 644 -o root -g root "$src" /etc/security/pam_u2f.conf
echo "Installed: /etc/security/pam_u2f.conf"
echo "Effective settings:"
grep -vE '^\s*#|^\s*$' /etc/security/pam_u2f.conf | sed 's/^/  /'

# Idempotent. enable-feature on an already-enabled feature is harmless but still
# rewrites and prints, so only call it when it would change something.
if authselect current 2>/dev/null | grep -q "with-pam-u2f"; then
  echo "authselect: with-pam-u2f already enabled"
else
  echo "authselect: enabling with-pam-u2f"
  sudo authselect enable-feature with-pam-u2f
fi

# The PAM line must NOT carry userverification itself or it would override the file
# above. authselect emits a fixed `pam_u2f.so cue`, which is exactly why it cannot.
echo "PAM lines (authselect-generated -- never hand-edit):"
grep -n "pam_u2f" /etc/pam.d/system-auth /etc/pam.d/password-auth | sed 's/^/  /'

# with-fingerprint is deliberately NOT changed here. It is a per-machine decision
# carried by the `fingerprintReader` chezmoi flag and it alters EVERY login path,
# not just this one, so it stays an explicit choice. Report drift, give the command.
echo "Fingerprint consistency:"
flag=$(chezmoi data 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("fingerprintReader", "unknown"))' 2>/dev/null || echo unknown)
if authselect current 2>/dev/null | grep -q "with-fingerprint"; then live=True; else live=False; fi
echo "  fingerprintReader=$flag  authselect with-fingerprint=$live"
if [ "$flag" = "True" ] && [ "$live" = "False" ]; then
  echo "  ⚠️  machine declares a reader but authselect does not use it:"
  echo "        sudo authselect enable-feature with-fingerprint"
elif [ "$flag" = "False" ] && [ "$live" = "True" ]; then
  echo "  ⚠️  no reader declared, yet pam_fprintd sits AHEAD of pam_u2f and will"
  echo "      stall every authentication before the key arms -- see SETUP.md 2a:"
  echo "        sudo authselect disable-feature with-fingerprint"
else
  echo "  consistent"
fi

# A configured stack with no credential behind it is the other silent half: the
# PAM line is present, pam_u2f runs, finds no entry for the user and falls through.
echo "Enrolment:"
af="${XDG_CONFIG_HOME:-$HOME/.config}/Yubico/u2f_keys"
if [ -s "$af" ]; then
  python3 - "$af" <<'EOF'
import sys
d = open(sys.argv[1]).read().rstrip("\n")
creds = d.split(":")[1:]
bad = [i for i, c in enumerate(creds, 1) if "+verification" not in c]
print(f"  {len(creds)} credential(s) in {sys.argv[1]}")
if bad:
    print(f"  ⚠️  credential(s) {bad} lack +verification, so userverification=1")
    print(f"      cannot be satisfied by them -- re-enrol with pamu2fcfg -V")
EOF
else
  echo "  none yet:  mise run bootstrap:u2f-enroll"
fi
'''

[tasks."bootstrap:u2f-enroll"]
description = "Enrol the plugged FIDO2 key into ~/.config/Yubico/u2f_keys with user verification (interactive: needs a touch, maybe a PIN)"
run = '''
set -e

# INTERACTIVE ONLY. pamu2fcfg talks to the authenticator directly, but user
# verification can fall back to a client PIN, and that prompt reads from /dev/tty --
# so this cannot be driven from a non-TTY subprocess (an agent, a hook, a pipe).
# Run it in a terminal.
#
# WHY ENROLMENT IS NOT CHEZMOI-MANAGED, and must not become so: the authfile holds
# per-machine, per-key credentials produced by touching hardware. It cannot be
# rendered from a template, and prosac/dotfiles is PUBLIC -- key handles are not
# secrets, but they are machine fingerprints and do not belong in a public repo.
# chezmoi manages the PACKAGES, pam_u2f.conf and the PAM stacks; the credential
# stays local. This task is the reproducible path to creating it.

command -v pamu2fcfg >/dev/null 2>&1 || { echo "pamu2fcfg not installed: sudo dnf install -y pamu2fcfg" >&2; exit 1; }
[ -f /usr/lib64/security/pam_u2f.so ] || echo "WARN pam_u2f.so absent -- enrolling anyway, but run bootstrap:pam-u2f once it is installed"

ndev=$(fido2-token -L 2>/dev/null | grep -c . || true)
if [ "$ndev" -eq 0 ]; then
  echo "No FIDO2 authenticator found. Plug one in." >&2
  echo "  (an absent key and an unenrolled key look identical from the lock screen)" >&2
  exit 1
fi
if [ "$ndev" -gt 1 ]; then
  echo "More than one authenticator is plugged in; pamu2fcfg would choose for you:" >&2
  fido2-token -L 2>/dev/null | sed 's/^/    /' >&2
  echo "Leave exactly one connected so you know which key you enrolled." >&2
  exit 1
fi
echo "Enrolling: $(fido2-token -L 2>/dev/null | head -1)"

af="${XDG_CONFIG_HOME:-$HOME/.config}/Yubico/u2f_keys"
mkdir -p "$(dirname "$af")"
chmod 700 "$(dirname "$af")"

# -V records +verification on the credential. WITHOUT IT `userverification = 1` in
# /etc/security/pam_u2f.conf is silently inert: the module asks for UV, the
# credential cannot provide it, and a bare touch is accepted instead.
new=$(mktemp)
if [ -s "$af" ]; then
  cp -a "$af" "$af.bak.$(date +%Y%m%d%H%M%S)"
  echo "Backed up existing authfile"
  # The format is ONE line per user, credentials colon-separated:
  #   <user>:<handle1>,<key1>,<type1>,<opts1>:<handle2>,...
  # so an extra key must EXTEND that line, not start a new one -- a line beginning
  # with ':' matches no user and is ignored in silence. pamu2fcfg emits no trailing
  # newline, which is what makes -n appendable inline; a hand-edited file may have
  # gained one, so strip it first.
  printf '%s' "$(cat "$af")" > "$new"
  pamu2fcfg -V -n >> "$new"
else
  pamu2fcfg -V > "$new"
fi

# Validate BEFORE replacing the real file, so a half-finished registration cannot
# cost you credentials you already had.
python3 - "$new" "$(id -un)" <<'PYEOF'
import sys
d = open(sys.argv[1]).read().rstrip("\n")
if not d:
    sys.exit("registration produced nothing -- authfile left unchanged")
if "\n" in d:
    sys.exit("result spans multiple lines; format is one line per user -- authfile left unchanged")
user, _, rest = d.partition(":")
if user != sys.argv[2]:
    sys.exit(f"username field is {user!r}, expected {sys.argv[2]!r} -- authfile left unchanged")
creds = [c for c in rest.split(":") if c]
if not creds:
    sys.exit("no credentials parsed -- authfile left unchanged")
for i, c in enumerate(creds, 1):
    f = c.split(",")
    if len(f) < 4:
        sys.exit(f"credential {i} has {len(f)} fields, expected 4 -- authfile left unchanged")
    if "+verification" not in f[3]:
        sys.exit(f"credential {i} lacks +verification -- authfile left unchanged")
print(f"  validated: {len(creds)} credential(s), all carrying +verification")
PYEOF

install -m 600 "$new" "$af"
rm -f "$new"
echo "Enrolled into $af"
echo "Verify the whole chain:  mise run check:fido2"
echo "Test without risking a locked screen:  sudo -k && sudo true"
'''

[tasks."check:fido2"]
description = "Verify the whole FIDO2 chain: packages, pam_u2f.conf, authselect feature, PAM lines, enrolled credentials, device presence"
run = '''
set +e
fail=0
say() { printf '%s\n' "$1"; }
bad() { printf '%s\n' "$1"; fail=1; }

say "Packages:"
[ -f /usr/lib64/security/pam_u2f.so ] && say "  pam_u2f.so           present" || bad "  pam_u2f.so           MISSING (sudo dnf install -y pam-u2f)"
command -v pamu2fcfg >/dev/null 2>&1 && say "  pamu2fcfg            present" || bad "  pamu2fcfg            MISSING (sudo dnf install -y pamu2fcfg)"
command -v fido2-token >/dev/null 2>&1 && say "  fido2-tools          present" || say "  fido2-tools          missing (diagnostics only)"

say "Module config:"
if [ -f /etc/security/pam_u2f.conf ]; then
  # Skip comments: pam_u2f.conf's own prose explains userverification=1, so a
  # bare grep matches twice and $uv ends up holding two lines.
  uv=$(grep -vE '^[ ]*#' /etc/security/pam_u2f.conf | grep -oE 'userverification[ ]*=[ ]*[0-9]+' | tr -d ' ' | head -1)
  [ -n "$uv" ] && say "  pam_u2f.conf         $uv" || bad "  pam_u2f.conf         present but sets no userverification"
else
  bad "  pam_u2f.conf         MISSING (mise run bootstrap:pam-u2f)"
fi

say "authselect:"
cur=$(authselect current 2>/dev/null)
printf '%s\n' "$cur" | grep -q with-pam-u2f && say "  with-pam-u2f         enabled" || bad "  with-pam-u2f         NOT enabled (mise run bootstrap:pam-u2f)"
flag=$(chezmoi data 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("fingerprintReader","unknown"))' 2>/dev/null || echo unknown)
printf '%s\n' "$cur" | grep -q with-fingerprint && live=True || live=False
if [ "$flag" = "$live" ]; then say "  with-fingerprint     $live (matches fingerprintReader)"
else bad "  with-fingerprint     $live but fingerprintReader=$flag -- see SETUP.md 2a"; fi

say "PAM lines (must be a bare 'cue'; any inline option overrides pam_u2f.conf):"
for f in /etc/pam.d/system-auth /etc/pam.d/password-auth; do
  l=$(grep -h "pam_u2f" "$f" 2>/dev/null)
  if [ -z "$l" ]; then bad "  $f  no pam_u2f line"
  elif printf '%s' "$l" | grep -qE 'pam_u2f\.so[ ]+cue[ ]*$'; then say "  $f  ok"
  else bad "  $f  inline options present: $l"; fi
done

say "Credentials:"
af="${XDG_CONFIG_HOME:-$HOME/.config}/Yubico/u2f_keys"
if [ -s "$af" ]; then
  python3 - "$af" "$(id -un)" <<'PYEOF'
import os, sys, stat
p, want = sys.argv[1], sys.argv[2]
d = open(p).read().rstrip("\n")
m = stat.S_IMODE(os.stat(p).st_mode)
print(f"  authfile             {p} (mode {m:04o})")
if m & 0o077:
    print(f"  WARN mode {m:04o} is group/world readable; 0600 expected")
if "\n" in d:
    print("  WARN multiple lines -- only the line starting with the username is read;")
    print("       a line beginning with ':' is ignored in silence")
user, _, rest = d.partition(":")
if user != want:
    print(f"  WARN username field {user!r} != {want!r}; pam_u2f will find no entry")
creds = [c for c in rest.split(":") if c]
print(f"  credentials          {len(creds)}")
for i, c in enumerate(creds, 1):
    f = c.split(",")
    opts = f[3] if len(f) > 3 else "(none)"
    t = f[2] if len(f) > 2 else "?"
    tail = "" if "+verification" in opts else "   <-- no +verification, UV unenforceable"
    print(f"    {i}: type={t} opts={opts}{tail}")
PYEOF
else
  bad "  authfile             MISSING or empty (mise run bootstrap:u2f-enroll)"
fi

say "Devices plugged in now:"
dl=$(fido2-token -L 2>/dev/null)
if [ -n "$dl" ]; then printf '%s\n' "$dl" | sed 's/^/  /'; else say "  none (not a fault -- the key need only be present when authenticating)"; fi

say "Lock-screen stack:"
if [ -f /etc/pam.d/dms-fido2 ]; then
  grep -q pam_u2f /etc/pam.d/dms-fido2 && say "  dms-fido2 references pam_u2f" || say "  dms-fido2 has no pam_u2f line"
  # Only failures logged AFTER pam-u2f was installed are meaningful; earlier ones
  # are the history of the bug being fixed. %{INSTALLTIME} is the install date --
  # the .so's mtime is the RPM BUILD date and would be far too early.
  inst=$(rpm -q --qf '%{INSTALLTIME}' pam-u2f 2>/dev/null)
  case "$inst" in (*[!0-9]*|"") since="7 days ago"; label="in the last 7 days";; (*) since="@$inst"; label="since pam-u2f was installed";; esac
  n=$(journalctl --user -u dms.service -b 0 --no-pager --since "$since" 2>/dev/null | grep -c "dlopen.*pam_u2f")
  if [ "${n:-0}" -eq 0 ]; then say "  no dlopen failures $label"; else bad "  $n dlopen failures $label -- module referenced but absent"; fi
else
  say "  /etc/pam.d/dms-fido2 not installed (mise run bootstrap:pam-dms)"
fi

say ""
if [ "$fail" -eq 0 ]; then say "FIDO2 chain: OK"; else say "FIDO2 chain: PROBLEMS ABOVE"; fi
exit "$fail"
'''

[tasks."bootstrap:pam-hyprlock"]
description = "Install /etc/pam.d/hyprlock-fido2 (lean lock-screen auth stack, no pam_sss double prompt; asks for sudo)"
run = '''
set -e
src="$(chezmoi source-path)/bootstrap/pam/hyprlock-fido2"
sudo install -m 644 -o root -g root "$src" /etc/pam.d/hyprlock-fido2
echo "Installed: /etc/pam.d/hyprlock-fido2"
echo "Effective stack:"
grep -vE '^\s*#|^\s*$' /etc/pam.d/hyprlock-fido2 | sed 's/^/  /'
# hyprlock uses the service named by auth:pam:module and silently falls back to
# /etc/pam.d/su when that file is absent — so assert the two actually agree.
echo "hyprlock auth:pam:module:"
grep -A3 "^auth" ~/.config/hypr/hyprlock.conf | grep "module" | sed 's/^/  /'
'''

[tasks."bootstrap:udev"]
description = "Install /etc/udev/rules.d/50-usb-no-autosuspend.rules and re-apply it (asks for sudo)"
run = '''
set -e
src="$(chezmoi source-path)/bootstrap/udev/50-usb-no-autosuspend.rules"
sudo install -m 644 -o root -g root "$src" /etc/udev/rules.d/50-usb-no-autosuspend.rules
sudo udevadm control --reload-rules
# Re-run the rules against already-present devices so no reboot is needed.
sudo udevadm trigger --subsystem-match=usb --action=change
echo "Installed: /etc/udev/rules.d/50-usb-no-autosuspend.rules"
# Report the devices the rule targets; "on" means autosuspend is held off.
for d in /sys/bus/usb/devices/*-*; do
  v=$(cat "$d/idVendor" 2>/dev/null) || continue
  p=$(cat "$d/idProduct" 2>/dev/null) || continue
  case "$v:$p" in
    047d:8055|05e3:0610|05e3:0620|1532:00aa|1532:00ab)
      printf "  %-12s %s  power/control=%s\n" "$(basename "$d")" "$v:$p" "$(cat "$d/power/control" 2>/dev/null)" ;;
  esac
done
'''

[tasks."bootstrap:opentabletdriver"]
description = "Install /etc/udev/rules.d/70-opentabletdriver.rules so OpenTabletDriver can open the tablet (asks for sudo)"
run = '''
set -e
src="$(chezmoi source-path)/bootstrap/udev/70-opentabletdriver.rules"
# The number must stay below 73 — see the header in the rules file. Drop the
# 99-* name this was first (wrongly) installed under so the two can't coexist.
sudo rm -f /etc/udev/rules.d/99-opentabletdriver.rules
sudo install -m 644 -o root -g root "$src" /etc/udev/rules.d/70-opentabletdriver.rules
sudo udevadm control --reload-rules
# Re-run against already-present devices so no replug/reboot is needed. hidraw
# carries the access ACL, input carries the LIBINPUT_IGNORE_DEVICE handover.
sudo udevadm trigger --subsystem-match=hidraw --action=change
sudo udevadm trigger --subsystem-match=usb --action=change
sudo udevadm trigger --subsystem-match=input --action=change
echo "Installed: /etc/udev/rules.d/70-opentabletdriver.rules"

# Verify with getfacl, NOT with `udevadm info | grep TAGS`: a too-late rules
# file still shows TAGS=:uaccess: while granting nothing, so the tag is not
# evidence. The ACL naming $USER is the only proof the daemon can open it.
echo "Wacom HID nodes:"
found=0
for h in /sys/class/hidraw/hidraw*; do
  dev="/dev/$(basename "$h")"
  v=$(cat "$h/device/../../idVendor" 2>/dev/null) || continue
  [ "$v" = "056a" ] || continue
  found=1
  if getfacl -p "$dev" 2>/dev/null | grep -q "^user:$USER:rw"; then
    printf "  %-14s ACL for %s: yes\n" "$dev" "$USER"
  else
    printf "  %-14s ACL for %s: NO — rule did not apply\n" "$dev" "$USER"
  fi
done
[ "$found" = 1 ] || echo "  (no Wacom tablet currently connected)"
'''

[tasks."bootstrap:pam-dms"]
description = "Install /etc/pam.d/dms-fido2 (FIDO2 + optional fingerprint auth stack for the DMS lock screen; asks for sudo)"
run = '''
set -e
# Rendered, not copied: the pam_fprintd line is gated on the per-machine
# `fingerprintReader` flag, so this must go through the template engine the
# same way bootstrap:dms-session does.
src="$(chezmoi source-path)/bootstrap/pam/dms-fido2.tmpl"
rendered="$(mktemp)"
chezmoi execute-template < "$src" > "$rendered"
sudo install -m 644 -o root -g root "$rendered" /etc/pam.d/dms-fido2
rm -f "$rendered"
echo "Installed: /etc/pam.d/dms-fido2"
echo "Effective stack:"
grep -vE '^\s*#|^\s*$' /etc/pam.d/dms-fido2 | sed 's/^/  /'
# DMS only uses this file if it can READ it as the logged-in user; if it cannot,
# it silently falls back to the `login` service and its pam_sss double prompt.
# So assert readability as the user, not just that the install succeeded.
echo "Readable by $(id -un) (required, else DMS silently falls back to \`login\`):"
if head -1 /etc/pam.d/dms-fido2 >/dev/null 2>&1; then echo "  yes"; else echo "  NO — DMS will fall back to \`login\`"; exit 1; fi
# And assert the settings file actually points here, since a mismatch is silent too.
echo "settings.json lockPamPath:"
python3 - <<'EOF' || true
import json, pathlib
p = pathlib.Path.home() / ".config/DankMaterialShell/settings.json"
if not p.exists():
    print("  settings.json not present yet (created on first DMS run)")
else:
    v = json.loads(p.read_text()).get("lockPamPath", "")
    ok = v == "/etc/pam.d/dms-fido2"
    print(f"  {v!r} {'(matches)' if ok else '(MISMATCH — the key will not be armed)'}")
EOF
# A running dms decided whether to use this file ONCE, at startup: Pam.qml's
# customPamWatcher is a FileView with no watchChanges, and only u2fConfigWatcher
# is re-read per lock. So installing the file under a dms that started earlier
# changes nothing until dms restarts -- and every check above still says "fine",
# because the filesystem IS fine. Compare the two timestamps and say so.
if systemctl --user is-active --quiet dms.service; then
  started=$(date -d "$(systemctl --user show dms.service -p ActiveEnterTimestamp --value)" +%s 2>/dev/null || echo 0)
  installed=$(stat -c %Y /etc/pam.d/dms-fido2)
  echo "Live session:"
  if [ "$started" -gt 0 ] && [ "$started" -lt "$installed" ]; then
    echo "  ⚠️  dms.service started BEFORE this file was installed, so it is still"
    echo "      using the ~/.local/state/DankMaterialShell/pam/dankshell fallback"
    echo "      (system-auth: pam_sss double prompt, 2s faildelay, no pam_u2f)."
    echo "      Pick it up with:  systemctl --user restart dms.service"
  else
    echo "  dms.service started after this file was installed — stack is live."
  fi
else
  echo "Live session:"
  echo "  dms.service not running (default Hyprland or niri) — nothing to reload."
fi
'''

[tasks."bootstrap:dms-session"]
description = "Install the 'Hyprland (DMS)' wayland session entry (sudo install + disable dms.service in default Hyprland)"
run = '''
set -e
src="$(chezmoi source-path)/bootstrap/wayland-sessions/hyprland-dms.desktop.tmpl"
rendered="$(mktemp --suffix=.desktop)"
chezmoi execute-template < "$src" > "$rendered"
sudo install -m 644 -o root -g root "$rendered" /usr/share/wayland-sessions/hyprland-dms.desktop
rm -f "$rendered"
# Persistently disable dms in the default session — the wrapper runtime-enables
# it for the DMS session only.
systemctl --user disable dms.service 2>/dev/null || true
echo "Installed: /usr/share/wayland-sessions/hyprland-dms.desktop"
echo "dms.service is now disabled in the default Hyprland session."
echo "Log out and pick 'Hyprland (DMS)' at GDM to try it."
'''

# Verification for the task above. Deliberately a separate task rather than a
# tail on bootstrap:dms-session: everything it checks can only be observed from
# INSIDE a running DMS session, which is one logout away from the install.
[tasks."check:dms-session"]
description = "Verify a 'Hyprland (DMS)' session came up right (masks took, DMS owns notifications, cleanup unit armed) -- run from inside that session"
run = '~/.local/bin/dms-session-check'

# The other half of "boot into DMS": bootstrap:dms-session makes the session
# selectable, this makes the machine actually go there without stopping at the
# greeter. Split from that task on purpose -- the session entry is useful on its
# own, and autologin is a security decision (it trades the GDM pam_u2f/password
# gate for the LUKS passphrase being the only thing between power-on and a live
# session), so it should not be a silent side effect of installing a .desktop.
[tasks."bootstrap:gdm-autologin"]
description = "Boot straight into the last-used session instead of stopping at the GDM greeter (asks for sudo)"
run = '''
set -e
conf=/etc/gdm/custom.conf
user="${USER:-$(id -un)}"
prog="$(chezmoi source-path)/bootstrap/gdm/autologin.awk"

new="$(mktemp)"
trap 'rm -f "$new"' EXIT
awk -v user="$user" -f "$prog" < "$conf" > "$new"

if cmp -s "$new" "$conf"; then
  echo "$conf already autologins $user — unchanged."
else
  sudo install -m 644 -o root -g root "$new" "$conf"
  echo "Set AutomaticLoginEnable=True / AutomaticLogin=$user in $conf."
fi

# WHICH session autologin lands in is GDM's state, not this task's -- see the
# warning block in bootstrap/gdm/autologin.awk. Printed so a wrong value is
# visible here instead of only at the next boot.
acct="/var/lib/AccountsService/users/$user"
keys="$(mktemp)"
trap 'rm -f "$new" "$keys"' EXIT
echo "Session GDM will start (from $acct):"
# Redirected to a file rather than piped into sed: a `sudo ... | sed` pipeline
# reports sed's exit status, so a failed/denied read would silently print
# nothing instead of falling through to the "none recorded" branch.
if sudo grep -hE '^(Session|XSession|SessionType)=' "$acct" >"$keys" 2>/dev/null && [ -s "$keys" ]; then
  sed 's/^/  /' "$keys"
else
  echo "  (none recorded — log in once at the greeter to set it)"
fi
echo "To change it, pick a different session at the greeter once; GDM rewrites that file on login."
echo
echo "Takes effect at the next boot. A session that dies immediately does NOT"
echo "loop: gdm attempts automatic login only once per boot and falls back to"
echo "the greeter, so a broken DMS session still leaves you a way in."
'''

[tasks."bootstrap:sleep"]
description = "Lid close -> plain suspend: logind/sleep drop-ins, zram off, SELinux labels on the swap subvolume, UPower critical action (asks for sudo)"
run = '''
set -e
src="$(chezmoi source-path)/bootstrap/systemd-sleep"

# What the lid does. Plain suspend, no escalation -- see the drop-in header for
# the 2026-08-12 backpack incident.
sudo install -d -m 755 /etc/systemd/logind.conf.d /etc/systemd/sleep.conf.d
sudo install -m 644 -o root -g root "$src/logind-10-lid-suspend.conf" /etc/systemd/logind.conf.d/10-lid-suspend.conf
sudo install -m 644 -o root -g root "$src/sleep-10-hibernate.conf" /etc/systemd/sleep.conf.d/10-hibernate.conf

# The superseded escalating policy. Left behind, this drop-in sorts under the
# same 10- prefix and would silently restore suspend-then-hibernate on a machine
# bootstrapped before 2026-08-12.
sudo rm -f /etc/systemd/logind.conf.d/10-lid-hibernate.conf

# zram off. It gets swap priority 100 against the disk swapfile's -1, so it was
# first in line for every swap-out -- including the reclaim that hibernation's
# image preallocation depends on, where swapping into RAM frees no RAM. See the
# file's own header for the measurements. Tear the live device down BEFORE
# daemon-reload: the reload drops the generated units, and systemd would be left
# holding an active unit whose definition no longer exists.
sudo systemctl stop dev-zram0.swap 2>/dev/null || true
sudo systemctl stop systemd-zram-setup@zram0.service 2>/dev/null || true
sudo swapoff /dev/zram0 2>/dev/null || true
sudo install -m 644 -o root -g root "$src/zram-generator-disable.conf" /etc/systemd/zram-generator.conf
sudo systemctl daemon-reload

# SELinux. `btrfs subvolume create` leaves the subvolume root inode with no
# security xattr, so /swap came up unlabeled_t, systemd-logind was denied
# `search` on it, and hibernation failed with a bare "Access denied" and no
# polkit trace at all. Only the FILE is swapfile_t -- Fedora declares
# swapfile_t as a file type, so labelling the DIRECTORY swapfile_t just moves
# the same denial to a new tcontext. The directory needs an ordinary
# traversable type. These rules live in the SELinux policy store, not in
# chezmoi, which is why they are reapplied here.
for spec in "root_t:/swap" "swapfile_t:/swap/swapfile"; do
  t="${spec%%:*}"; p="${spec#*:}"
  sudo semanage fcontext -a -t "$t" "$p" 2>/dev/null || sudo semanage fcontext -m -t "$t" "$p"
done
sudo restorecon -RFv /swap

# UPower's critical action covers only the awake-and-draining case; UPower does
# not poll during s2idle, which is why a flat weekend produced no warning.
# PercentageAction must stay below PercentageCritical (5.0).
sudo sed -i -E 's/^CriticalPowerAction=.*/CriticalPowerAction=Hibernate/' /etc/UPower/UPower.conf
sudo sed -i -E 's/^PercentageAction=.*/PercentageAction=4.0/' /etc/UPower/UPower.conf

sudo systemctl reload systemd-logind    # CanReload=yes -- no session loss
sudo systemctl try-restart upower

lidprop() {
  busctl get-property org.freedesktop.login1 /org/freedesktop/login1 \
    org.freedesktop.login1.Manager "$1" | sed 's/^s //'
}
echo
echo "==> Queried live (mechanism, not just config):"
printf "  HandleLidSwitch              = %s\n" "$(lidprop HandleLidSwitch)"
printf "  HandleLidSwitchExternalPower = %s\n" "$(lidprop HandleLidSwitchExternalPower)"
echo "==> On disk:"
grep -hE '^(HibernateDelaySec|HibernateOnACPower)=' /etc/systemd/sleep.conf.d/10-hibernate.conf | sed 's/^/  /'
grep -hE '^(CriticalPowerAction|PercentageAction)=' /etc/UPower/UPower.conf | sed 's/^/  /'
echo "==> Swap topology (the disk swapfile must be the ONLY entry -- no zram):"
swapon --show | sed 's/^/  /'
echo "==> SELinux labels:"
ls -Zd /swap | sed 's/^/  /'
sudo ls -Zd /swap/swapfile | sed 's/^/  /'
'''

[tasks."bootstrap:quickshell-rebuild"]
description = "Rebuild quickshell against the installed Qt after a qt6 update broke the DMS session (asks for sudo)"
run = '~/.local/bin/quickshell-rebuild'

[tasks."check:quickshell"]
description = "Report whether quickshell still loads against the installed Qt (the check hyprland-dms runs before masking the default shell)"
run = '~/.local/bin/quickshell-rebuild --check -v'

# /var/lib/flatpak is a symlink to a directory on a separate filesystem on this
# machine (the SSD raid), because the flatpak system installation is far too big
# for the root subvolume. Fedora's own flatpak-add-fedora-repos.service has no
# idea about that: it is ordered only after basic.target, so at boot it runs
# BEFORE the mount and dies with
#
#     error: Unable to create repository at /var/lib/flatpak
#            (Creating repo: mkdirat: No such file or directory)
#
# leaving a failed system unit on every single boot. Nothing downstream breaks --
# the remote is already configured from a previous successful run, so this is
# noise rather than damage -- but it is noise that sits in `systemctl
# list-units --state=failed` forever and trains you to ignore that list.
#
# The drop-in is GENERATED rather than shipped as a static file in bootstrap/,
# because the mount point is per-machine: it is discovered here with findmnt
# instead of being hardcoded, and on a machine where /var/lib/flatpak is an
# ordinary directory on / the task correctly does nothing at all.
#
# ⚠️ RequiresMountsFor= is given the RESOLVED path, not /var/lib/flatpak.
# systemd builds the mount unit names by walking the path prefixes literally and
# does not follow symlinks along the way, so pointing it at the symlink would
# generate a dependency on a -.mount that is always already up -- i.e. it would
# look correct and change nothing.
[tasks."bootstrap:flatpak-mount-ordering"]
description = "Order flatpak-add-fedora-repos.service after the filesystem holding /var/lib/flatpak (asks for sudo)"
run = '''
set -e
real="$(readlink -f /var/lib/flatpak)"
if [ ! -e "$real" ]; then
  echo "/var/lib/flatpak resolves to $real, which does not exist — is the disk mounted?" >&2
  exit 1
fi
mp="$(findmnt -no TARGET --target "$real")"
echo "/var/lib/flatpak -> $real (on mount $mp)"
if [ "$mp" = "/" ]; then
  echo "Flatpak lives on the root filesystem — no ordering needed, nothing to do."
  exit 0
fi

dir=/etc/systemd/system/flatpak-add-fedora-repos.service.d
sudo install -d -m 755 "$dir"
printf '%s\n' \
  "# Managed by \`mise run bootstrap:flatpak-mount-ordering\` — do not edit by hand." \
  "# $real lives on $mp, which is not mounted when basic.target is reached." \
  "[Unit]" \
  "RequiresMountsFor=$mp" \
  | sudo tee "$dir/10-wait-for-mount.conf" >/dev/null
sudo chmod 644 "$dir/10-wait-for-mount.conf"
sudo systemctl daemon-reload
echo "Installed: $dir/10-wait-for-mount.conf"
echo "Effective ordering:"
systemctl show flatpak-add-fedora-repos.service -p RequiresMountsFor -p After \
  | tr ' ' '\n' | grep -iE "mount|RequiresMountsFor" | sed 's/^/  /'
# The unit is ConditionPathExists-free and idempotent (`remote-add --if-not-exists`),
# so clearing the failed state now means the next boot is the real test.
sudo systemctl reset-failed flatpak-add-fedora-repos.service 2>/dev/null || true
echo "Failed state cleared — it should stay clean from the next boot on."
'''

# starship is here rather than installed by its own upstream script: the
# install-packages script used to pipe https://starship.rs/install.sh into a
# ROOT shell, unattended, on every fresh bootstrap. mise resolves starship
# through aqua (`aqua:starship/starship`), which verifies upstream checksums,
# and installs it under ~/.local/share/mise as this user -- no root in the path.
# .zshrc runs `starship init zsh` unconditionally, so the shim dir being first
# on PATH is what makes this work on first login.
[tools]
"github:can1357/oh-my-pi" = "16.4.8"
argocd = "3.5"
go = "1.27.3"
node = "26.12.1"
nsc = "2.15.0"
pnpm = "12.15.0"
starship = "1.27.0"
usage = "7.1.2"
