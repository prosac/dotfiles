# Global mise config — tasks available from any cwd.
# Managed by chezmoi: edit the live file, then `mise run ch:readd`.

# Namespacing:
#   ch:*   chezmoi workflows
#   dots:* dotfile change-review / snapshot tooling (coming)

# mise's go tool exports GOBIN=$GOROOT/bin, a version-pinned dir that is NOT on
# PATH (and is wiped on every Go upgrade). Redirect `go install` output to the
# conventional $GOPATH/bin, which IS on PATH.
[env]
GOBIN = "{{env.HOME}}/.local/go/bin"

[tasks."ch:status"]
description = "Show chezmoi drift (source vs target)"
run = "chezmoi status"

[tasks."ch:diff"]
description = "Show pending chezmoi changes"
run = "chezmoi diff"

[tasks."ch:apply"]
description = "Apply source state to target"
run = "chezmoi apply"

[tasks."ch:readd"]
description = "Capture target edits into source (use after editing live configs)"
run = "chezmoi re-add"

[tasks."ch:managed"]
description = "List files managed by chezmoi"
run = "chezmoi managed"

[tasks."ch:unmanaged"]
description = "List files in target home that are NOT managed by chezmoi"
run = "chezmoi unmanaged --path-style=absolute"

[tasks."ch:cd"]
description = "Print the chezmoi source path"
run = "chezmoi source-path"

[tasks."ch:git"]
description = 'Run git in the chezmoi source repo (mise run ch:git -- status)'
run = 'chezmoi git -- {{arg(name="args", var=true)}}'

[tasks."ch:sync"]
description = "Pull source repo and apply"
run = "chezmoi git -- pull --rebase && chezmoi apply"

[tasks."ch:commit"]
description = "Stage all source changes and commit (mise run ch:commit -- 'commit msg')"
run = 'chezmoi git -- add -A && chezmoi git -- commit -m {{arg(name="msg")}}'

[tasks."ch:push"]
description = "Stage all source changes, commit, and push (mise run ch:push -- 'commit msg')"
run = 'chezmoi git -- add -A && chezmoi git -- commit -m {{arg(name="msg")}} && chezmoi git -- push'

[tasks."ch:scan"]
description = "Scan the chezmoi source repo for secrets (gitleaks)"
run = 'gitleaks git --verbose --redact "$(chezmoi source-path)"'

[tasks."ch:hooks"]
description = "Install pre-commit hooks into the chezmoi source repo"
run = '(cd "$(chezmoi source-path)" && pre-commit install)'

# --- dotfile snapshot review ---

[tasks."dots:snap"]
description = "Create a btrfs snapshot of /home now (manual)"
run = "dotsnap"

[tasks."dots:snaps"]
description = "List dotfile snapshots, oldest first"
run = "ls -1 /home/.snapshots/hourly/ | sort"

[tasks."dots:latest"]
description = "Print path to the most recent snapshot"
run = "ls -1 /home/.snapshots/hourly/ | sort | tail -1 | sed 's|^|/home/.snapshots/hourly/|'"

[tasks."dots:review"]
description = "Show dotfile drift since latest snapshot (optional: snapshot name)"
run = "dotreview"

# --- one-time per-machine setup ---

[tasks."bootstrap:sudoers"]
description = "Install /etc/sudoers.d/dotsnap (renders the template, asks for sudo)"
run = '''
set -e
src="$(chezmoi source-path)/bootstrap/sudoers/dotsnap.tmpl"
rendered="$(mktemp)"
chezmoi execute-template < "$src" > "$rendered"
sudo install -m 440 -o root -g root "$rendered" /etc/sudoers.d/dotsnap
sudo visudo -cf /etc/sudoers.d/dotsnap
rm -f "$rendered"
echo "Installed: /etc/sudoers.d/dotsnap"
'''

[tasks."bootstrap:tmpfiles"]
description = "Install /etc/tmpfiles.d/dotsnap.conf and create the snapshot tree (asks for sudo)"
run = '''
set -e
src="$(chezmoi source-path)/bootstrap/tmpfiles/dotsnap.conf.tmpl"
rendered="$(mktemp)"
chezmoi execute-template < "$src" > "$rendered"
sudo install -m 644 -o root -g root "$rendered" /etc/tmpfiles.d/dotsnap.conf
rm -f "$rendered"
sudo systemd-tmpfiles --create /etc/tmpfiles.d/dotsnap.conf
echo "Installed: /etc/tmpfiles.d/dotsnap.conf"
# inode 256 is the root of a btrfs subvolume; anything else means tmpfiles fell
# back to a plain directory (see the comments in the template).
if [ "$(stat -c %i /home/.snapshots)" = "256" ]; then
  echo "/home/.snapshots is a btrfs subvolume (excluded from /home snapshots)"
else
  echo "WARNING: /home/.snapshots is a plain directory, not a subvolume" >&2
fi
'''

[tasks."bootstrap:pam-u2f"]
description = "Install /etc/security/pam_u2f.conf (requires FIDO2 user verification; asks for sudo)"
run = '''
set -e
src="$(chezmoi source-path)/bootstrap/pam/pam_u2f.conf"
sudo install -m 644 -o root -g root "$src" /etc/security/pam_u2f.conf
echo "Installed: /etc/security/pam_u2f.conf"
echo "Effective settings:"
grep -vE '^\s*#|^\s*$' /etc/security/pam_u2f.conf | sed 's/^/  /'
# The PAM line must NOT carry userverification itself, or it would override this.
echo "PAM line (authselect-generated):"
grep -n "pam_u2f" /etc/pam.d/system-auth | sed 's/^/  /'
'''

[tasks."bootstrap:pam-hyprlock"]
description = "Install /etc/pam.d/hyprlock-fido2 (lean lock-screen auth stack, no pam_sss double prompt; asks for sudo)"
run = '''
set -e
src="$(chezmoi source-path)/bootstrap/pam/hyprlock-fido2"
sudo install -m 644 -o root -g root "$src" /etc/pam.d/hyprlock-fido2
echo "Installed: /etc/pam.d/hyprlock-fido2"
echo "Effective stack:"
grep -vE '^\s*#|^\s*$' /etc/pam.d/hyprlock-fido2 | sed 's/^/  /'
# hyprlock uses the service named by auth:pam:module and silently falls back to
# /etc/pam.d/su when that file is absent — so assert the two actually agree.
echo "hyprlock auth:pam:module:"
grep -A3 "^auth" ~/.config/hypr/hyprlock.conf | grep "module" | sed 's/^/  /'
'''

[tasks."bootstrap:udev"]
description = "Install /etc/udev/rules.d/50-usb-no-autosuspend.rules and re-apply it (asks for sudo)"
run = '''
set -e
src="$(chezmoi source-path)/bootstrap/udev/50-usb-no-autosuspend.rules"
sudo install -m 644 -o root -g root "$src" /etc/udev/rules.d/50-usb-no-autosuspend.rules
sudo udevadm control --reload-rules
# Re-run the rules against already-present devices so no reboot is needed.
sudo udevadm trigger --subsystem-match=usb --action=change
echo "Installed: /etc/udev/rules.d/50-usb-no-autosuspend.rules"
# Report the devices the rule targets; "on" means autosuspend is held off.
for d in /sys/bus/usb/devices/*-*; do
  v=$(cat "$d/idVendor" 2>/dev/null) || continue
  p=$(cat "$d/idProduct" 2>/dev/null) || continue
  case "$v:$p" in
    047d:8055|05e3:0610|05e3:0620)
      printf "  %-12s %s  power/control=%s\n" "$(basename "$d")" "$v:$p" "$(cat "$d/power/control" 2>/dev/null)" ;;
  esac
done
'''

[tasks."bootstrap:opentabletdriver"]
description = "Install /etc/udev/rules.d/70-opentabletdriver.rules so OpenTabletDriver can open the tablet (asks for sudo)"
run = '''
set -e
src="$(chezmoi source-path)/bootstrap/udev/70-opentabletdriver.rules"
# The number must stay below 73 — see the header in the rules file. Drop the
# 99-* name this was first (wrongly) installed under so the two can't coexist.
sudo rm -f /etc/udev/rules.d/99-opentabletdriver.rules
sudo install -m 644 -o root -g root "$src" /etc/udev/rules.d/70-opentabletdriver.rules
sudo udevadm control --reload-rules
# Re-run against already-present devices so no replug/reboot is needed. hidraw
# carries the access ACL, input carries the LIBINPUT_IGNORE_DEVICE handover.
sudo udevadm trigger --subsystem-match=hidraw --action=change
sudo udevadm trigger --subsystem-match=usb --action=change
sudo udevadm trigger --subsystem-match=input --action=change
echo "Installed: /etc/udev/rules.d/70-opentabletdriver.rules"

# Verify with getfacl, NOT with `udevadm info | grep TAGS`: a too-late rules
# file still shows TAGS=:uaccess: while granting nothing, so the tag is not
# evidence. The ACL naming $USER is the only proof the daemon can open it.
echo "Wacom HID nodes:"
found=0
for h in /sys/class/hidraw/hidraw*; do
  dev="/dev/$(basename "$h")"
  v=$(cat "$h/device/../../idVendor" 2>/dev/null) || continue
  [ "$v" = "056a" ] || continue
  found=1
  if getfacl -p "$dev" 2>/dev/null | grep -q "^user:$USER:rw"; then
    printf "  %-14s ACL for %s: yes\n" "$dev" "$USER"
  else
    printf "  %-14s ACL for %s: NO — rule did not apply\n" "$dev" "$USER"
  fi
done
[ "$found" = 1 ] || echo "  (no Wacom tablet currently connected)"
'''

[tasks."bootstrap:dms-session"]
description = "Install the 'Hyprland (DMS)' wayland session entry (sudo install + disable dms.service in default Hyprland)"
run = '''
set -e
src="$(chezmoi source-path)/bootstrap/wayland-sessions/hyprland-dms.desktop.tmpl"
rendered="$(mktemp --suffix=.desktop)"
chezmoi execute-template < "$src" > "$rendered"
sudo install -m 644 -o root -g root "$rendered" /usr/share/wayland-sessions/hyprland-dms.desktop
rm -f "$rendered"
# Persistently disable dms in the default session — the wrapper runtime-enables
# it for the DMS session only.
systemctl --user disable dms.service 2>/dev/null || true
echo "Installed: /usr/share/wayland-sessions/hyprland-dms.desktop"
echo "dms.service is now disabled in the default Hyprland session."
echo "Log out and pick 'Hyprland (DMS)' at GDM to try it."
'''

[tasks."bootstrap:sleep"]
description = "Lid close -> plain suspend: logind/sleep drop-ins, zram off, SELinux labels on the swap subvolume, UPower critical action (asks for sudo)"
run = '''
set -e
src="$(chezmoi source-path)/bootstrap/systemd-sleep"

# What the lid does. Plain suspend, no escalation -- see the drop-in header for
# the 2026-08-12 backpack incident.
sudo install -d -m 755 /etc/systemd/logind.conf.d /etc/systemd/sleep.conf.d
sudo install -m 644 -o root -g root "$src/logind-10-lid-suspend.conf" /etc/systemd/logind.conf.d/10-lid-suspend.conf
sudo install -m 644 -o root -g root "$src/sleep-10-hibernate.conf" /etc/systemd/sleep.conf.d/10-hibernate.conf

# The superseded escalating policy. Left behind, this drop-in sorts under the
# same 10- prefix and would silently restore suspend-then-hibernate on a machine
# bootstrapped before 2026-08-12.
sudo rm -f /etc/systemd/logind.conf.d/10-lid-hibernate.conf

# zram off. It gets swap priority 100 against the disk swapfile's -1, so it was
# first in line for every swap-out -- including the reclaim that hibernation's
# image preallocation depends on, where swapping into RAM frees no RAM. See the
# file's own header for the measurements. Tear the live device down BEFORE
# daemon-reload: the reload drops the generated units, and systemd would be left
# holding an active unit whose definition no longer exists.
sudo systemctl stop dev-zram0.swap 2>/dev/null || true
sudo systemctl stop systemd-zram-setup@zram0.service 2>/dev/null || true
sudo swapoff /dev/zram0 2>/dev/null || true
sudo install -m 644 -o root -g root "$src/zram-generator-disable.conf" /etc/systemd/zram-generator.conf
sudo systemctl daemon-reload

# SELinux. `btrfs subvolume create` leaves the subvolume root inode with no
# security xattr, so /swap came up unlabeled_t, systemd-logind was denied
# `search` on it, and hibernation failed with a bare "Access denied" and no
# polkit trace at all. Only the FILE is swapfile_t -- Fedora declares
# swapfile_t as a file type, so labelling the DIRECTORY swapfile_t just moves
# the same denial to a new tcontext. The directory needs an ordinary
# traversable type. These rules live in the SELinux policy store, not in
# chezmoi, which is why they are reapplied here.
for spec in "root_t:/swap" "swapfile_t:/swap/swapfile"; do
  t="${spec%%:*}"; p="${spec#*:}"
  sudo semanage fcontext -a -t "$t" "$p" 2>/dev/null || sudo semanage fcontext -m -t "$t" "$p"
done
sudo restorecon -RFv /swap

# UPower's critical action covers only the awake-and-draining case; UPower does
# not poll during s2idle, which is why a flat weekend produced no warning.
# PercentageAction must stay below PercentageCritical (5.0).
sudo sed -i -E 's/^CriticalPowerAction=.*/CriticalPowerAction=Hibernate/' /etc/UPower/UPower.conf
sudo sed -i -E 's/^PercentageAction=.*/PercentageAction=4.0/' /etc/UPower/UPower.conf

sudo systemctl reload systemd-logind    # CanReload=yes -- no session loss
sudo systemctl try-restart upower

lidprop() {
  busctl get-property org.freedesktop.login1 /org/freedesktop/login1 \
    org.freedesktop.login1.Manager "$1" | sed 's/^s //'
}
echo
echo "==> Queried live (mechanism, not just config):"
printf "  HandleLidSwitch              = %s\n" "$(lidprop HandleLidSwitch)"
printf "  HandleLidSwitchExternalPower = %s\n" "$(lidprop HandleLidSwitchExternalPower)"
echo "==> On disk:"
grep -hE '^(HibernateDelaySec|HibernateOnACPower)=' /etc/systemd/sleep.conf.d/10-hibernate.conf | sed 's/^/  /'
grep -hE '^(CriticalPowerAction|PercentageAction)=' /etc/UPower/UPower.conf | sed 's/^/  /'
echo "==> Swap topology (the disk swapfile must be the ONLY entry -- no zram):"
swapon --show | sed 's/^/  /'
echo "==> SELinux labels:"
ls -Zd /swap | sed 's/^/  /'
sudo ls -Zd /swap/swapfile | sed 's/^/  /'
'''

[tools]
argocd = "3.1"
go = "1.26.0"
node = "24.14.0"
nsc = "2.12.0"
usage = "2.13.1"
