# Drop-in, not a fork: fumon.service is shipped by the `fumon` package, so only
# the ordering is adjusted here and vendor updates keep applying.
#
# fumon's whole job is to notify you when a user unit fails, which it does by
# calling notify-send -- so it needs something OWNING org.freedesktop.Notifications
# on the session bus. In the "Hyprland (DMS)" session that name belongs to
# dms.service (its unit is Type=dbus, BusName=org.freedesktop.Notifications), and
# dms is still starting while fumon runs. notify-send then gets
#
#     GDBus.Error:org.freedesktop.DBus.Error.ServiceUnknown: The name is not activatable
#
# fumon exits 1, and five restarts inside systemd's default 10s start-limit
# window burn the limit in under a second. The failure monitor ends up being the
# one permanently failed unit at every single login -- and, worse, it is then not
# running to report anything that fails after it.
#
# ⚠️ The unit's own ExecCondition does NOT cover this. It checks that the
# notify-send BINARY exists, which it always does; it says nothing about whether
# anybody is listening on the bus name.
#
# After= alone is not sufficient -- dms.service reaching "started" is the Type=dbus
# bus-name acquisition, so ordering after it is exactly the right barrier, but a
# cold cache can still leave the first notify racing. RestartSec widens the five
# allowed starts from ~5s to ~25s, which covers that without touching the limit.
#
# Not Requires=/After= in the vendor unit's sense of a hard dep: in the DEFAULT
# Hyprland session and under niri the notification daemon is wayland-noti, not
# dms, and dms.service is not enabled at all there. An ordering-only dependency
# on a unit that will never start is a no-op, so this one drop-in is correct in
# all three sessions.
[Unit]
After=dms.service

[Service]
RestartSec=5
