# GTK3 settings — RUNTIME-MANAGED by ~/.local/bin/toggle-color-scheme.
#
# chezmoi seeds this file once (create_ prefix: never overwritten afterward),
# because toggle-color-scheme rewrites it on every dark/light flip. GtkSettings
# watches this file, so GTK3 apps re-theme live.
#
# There is no settings daemon under Hyprland/niri, so for plain GTK3 apps this
# file — not gsettings, not the portal — is what decides light vs dark. Hardcoding
# gtk-application-prefer-dark-theme here is exactly what used to pin every GTK3
# app to dark forever. Let toggle-color-scheme own it.
#
# This seed is the dark palette, matching the Hyprland/niri border default.
[Settings]
gtk-theme-name=Graphite-teal-Dark-nord
gtk-icon-theme-name=Adwaita
gtk-application-prefer-dark-theme=1
