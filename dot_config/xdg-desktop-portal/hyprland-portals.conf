# Portal backend routing for the Hyprland session.
#
# Why this file exists: org.freedesktop.impl.portal.Settings is what serves
# org.freedesktop.appearance color-scheme, and that value is what libadwaita/GTK4,
# ghostty, Chromium/Electron and Emacs (auto-dark) all read to decide light vs
# dark. xdg-desktop-portal-hyprland does not implement Settings; the GTK backend
# does, and it mirrors the gsettings that toggle-color-scheme flips.
#
# Fedora's packaged /usr/share/xdg-desktop-portal/hyprland-portals.conf already
# resolves Settings to gtk via its `default=hyprland;gtk` line. This file pins it
# explicitly so the appearance source can't drift, and because gtk.portal declares
# `UseIn=gnome` — meaning nothing but this routing makes it eligible here.
#
# org.freedesktop.impl.portal.Secret is routed for the same reason, and it is the
# same trap: gnome-keyring.portal also declares `UseIn=gnome`, so on Hyprland the
# Secret portal is simply absent -- `busctl --user introspect
# org.freedesktop.portal.Desktop /org/freedesktop/portal/desktop` lists no
# portal.Secret interface at all. gnome-keyring is running and owns
# org.freedesktop.secrets either way, so UNSANDBOXED apps are unaffected and the
# breakage is invisible until a FLATPAK asks for a keyring: sandboxed clients go
# through the portal, not the bus name, and get "No such interface
# org.freedesktop.portal.Secret" instead.
#
# Found while debugging the Bitwarden flatpak (2026-09-20), and note what it was
# NOT: that app's greyed-out "Unlock with system authentication" button turned out
# to be expected Linux behaviour (BiometricsStatus.UnlockNeeded -- its Linux
# backend hardcodes hasPersistentKey()=false and enrollPersistent() as a no-op, so
# the biometric key never outlives the process and a master-password unlock is
# always required once per app start; biometrics only covers lock->unlock inside a
# session). The absent Secret portal was a separate, real defect found on the way:
# supportsBiometrics() there is just `passwords.isAvailable()`, so a sandboxed
# client with no reachable keyring reports HardwareUnavailable and fills its log
# with the "No such interface" line above. Worth fixing on its own merits --
# anything else flatpaked that wants libsecret needs this routing too.
#
# CAVEAT: a user-level <desktop>-portals.conf REPLACES the packaged one outright,
# it is not merged key-by-key. The `default` line below therefore has to stay in
# sync with the packaged file — re-check it after xdg-desktop-portal-hyprland
# updates. Verify the live routing with:
#   busctl --user call org.freedesktop.portal.Desktop /org/freedesktop/portal/desktop \
#     org.freedesktop.portal.Settings Read ss org.freedesktop.appearance color-scheme
#   -> u 1 = prefer-dark, u 2 = prefer-light
#
# niri needs no equivalent: its packaged niri-portals.conf routes the default to
# gnome;gtk, and xdg-desktop-portal-gnome reads the same gsettings.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.Settings=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
