# GTK4 settings — RUNTIME-MANAGED by ~/.local/bin/toggle-color-scheme.
#
# chezmoi seeds this file once (create_ prefix: never overwritten afterward),
# because toggle-color-scheme rewrites it on every dark/light flip.
#
# libadwaita apps ignore gtk-theme-name and take light/dark from the portal's
# org.freedesktop.appearance color-scheme instead; this file is what steers plain
# (non-libadwaita) GTK4 apps. Both end up following the same gsettings flip.
#
# Deliberately absent: gtk.css / gtk-dark.css. Graphite's `install.sh -l` would
# symlink a *static* gtk.css in here, and libadwaita only ever reads gtk.css — so
# that flag pins every GTK4 app to one scheme. See the installer script.
#
# This seed is the dark palette, matching the Hyprland/niri border default.
[Settings]
gtk-theme-name=Graphite-teal-Dark-nord
gtk-icon-theme-name=Adwaita
gtk-application-prefer-dark-theme=1
