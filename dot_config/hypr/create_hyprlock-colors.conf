# hyprlock colors — RUNTIME-MANAGED by ~/.local/bin/toggle-color-scheme.
#
# chezmoi seeds this file once (create_ prefix: never overwritten afterward),
# because toggle-color-scheme rewrites it on every dark/light flip. It is
# `source`d at the TOP of hyprlock.conf — hyprlang resolves variables in order, so
# they must be defined before the blocks that use them.
#
# hyprlock reads its config at launch (one process per lock), so a flip is picked
# up by the next lock; nothing needs reloading.
#
# The backdrop is `path = screenshot`, so $lock_brightness is what decides whether
# the lock screen reads light or dark — the text colors follow from it.
#
# This seed is the dark palette, matching the Hyprland/niri border default.
$lock_brightness = 0.4
$lock_outer = rgba(5c909099)
$lock_inner = rgba(14161aee)
$lock_font = rgba(c0c4ccff)
$lock_font_dim = rgba(c0c4cc99)
