# Colors live in a separate file that toggle-color-scheme rewrites on every
# dark/light flip. Must be sourced FIRST — hyprlang resolves variables in order.
source = ~/.config/hypr/hyprlock-colors.conf

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = $lock_brightness
}

label {
    monitor =
    text = $TIME
    font_size = 48
    font_family = JetBrains Mono
    color = $lock_font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = $DATE
    font_size = 18
    font_family = JetBrains Mono
    color = $lock_font_dim
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 48
    position = 0, -60
    halign = center
    valign = center
    outline_thickness = 2
    outer_color = $lock_outer
    inner_color = $lock_inner
    font_color = $lock_font
    fade_on_empty = false
    placeholder_text = <i>touch key or enter password</i>
    dots_center = true
    shadow_passes = 2
}
