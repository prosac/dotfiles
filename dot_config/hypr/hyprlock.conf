# Colors live in a separate file that toggle-color-scheme rewrites on every
# dark/light flip. Must be sourced FIRST — hyprlang resolves variables in order.
source = ~/.config/hypr/hyprlock-colors.conf

# Authenticate against our own lean PAM service instead of the shipped
# `auth include login`. `login` → system-auth → `pam_sss.so forward_pass` (from
# authselect's sssd profile, on a machine with no SSSD domain) prompts for the
# password a SECOND time, so a PAM transaction whose pam_u2f leg has timed out
# needs two Enters to die before hyprlock's retry loop re-arms the FIDO2 key —
# the "stick only wakes up after hitting Enter three times" symptom. It also
# skips `pam_faildelay delay=2000000`, a 2s penalty per failed attempt.
#
# Installed by `mise run bootstrap:pam-hyprlock` from bootstrap/pam/hyprlock-fido2.
# If that file is absent hyprlock falls back to /etc/pam.d/su, which still
# authenticates (via system-auth) — so this cannot lock anyone out.
# See ~/Documents/docs/fido2-login-latency-power-management.md
auth {
    pam {
        module = hyprlock-fido2
    }
}

# blur_passes was 3. Cut to 1 after the 2026-08-12 compositor deadlock: hyprlock's
# startup resource gather took 2015ms that time against 6-8ms on the four previous
# locks of the same session, then jammed for 414s and wedged Hyprland on an atomic
# commit. The screenshot capture + blur is the only GPU-heavy, load-sensitive step in
# that startup, and 3 passes over 2880x1800 is the bulk of it. The trigger for the
# slowdown was never established, so this is insurance on the critical path rather
# than a fix. See ~/Documents/docs/hyprland-freeze-atomic-commit-deadlock.md
background {
    monitor =
    path = screenshot
    blur_passes = 1
    blur_size = 7
    brightness = $lock_brightness
}

label {
    monitor =
    text = $TIME
    font_size = 48
    font_family = JetBrains Mono
    color = $lock_font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = $DATE
    font_size = 18
    font_family = JetBrains Mono
    color = $lock_font_dim
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 48
    position = 0, -60
    halign = center
    valign = center
    outline_thickness = 2
    outer_color = $lock_outer
    inner_color = $lock_inner
    font_color = $lock_font
    fade_on_empty = false
    placeholder_text = <i>touch key or enter password</i>
    # A failed attempt is exactly the moment hyprlock's retry loop starts a fresh
    # PAM transaction, which re-arms the FIDO2 key — so say so.
    fail_text = <i>$FAIL — key re-armed, touch it</i>
    dots_center = true
    shadow_passes = 2
}

# PAM state, so the lock screen stops claiming "touch key" after the key has gone
# to sleep. NB $PAMPROMPT only ever carries real PAM *prompts*: pam_u2f's "Please
# touch the FIDO authenticator." arrives as PAM_TEXT_INFO, which hyprlock logs but
# does not store (src/auth/Pam.cpp:47-58, which only captures pam_faillock's "left
# to unlock" and pam_fprintd's "Place your finger"). So this label is empty —
# invisible — while the key is armed, and reads "Password:" once the ~31s CTAP
# timeout has lapsed. Empty vs not is therefore the signal: text here means the
# key is asleep and needs one Enter to re-arm.
label {
    monitor =
    text = $PAMPROMPT
    font_size = 13
    font_family = JetBrains Mono
    color = $lock_font_dim
    position = 0, -105
    halign = center
    valign = center
}

# Hibernation notice. Empty — and so invisible — except around an actual
# hibernation: "Hibernating …" while the image is being written, and "Resumed
# from hibernation" for ten minutes after waking, which is what explains an
# otherwise alarming ~25s black screen on either side.
#
# It has to arrive through a file rather than any kind of IPC: `user.slice` is
# frozen for the whole of the write, so nothing in the session can be drawn or
# even talked to (systemd-sleep(8)). The text is painted BEFORE the freeze and
# simply stays on screen. $HOME rather than an absolute path — this repo is
# public.
label {
    monitor =
    text = cmd[update:2000] $HOME/.config/hypr/sleep-state.py
    font_size = 13
    font_family = JetBrains Mono
    color = $lock_font_dim
    position = 0, -135
    halign = center
    valign = center
}
