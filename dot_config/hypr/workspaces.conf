# Window → workspace routing rules.
# silent: open on target workspace without switching focus.
# See workspace labels in setup_workspaces.sh.
#
# Syntax note (Hyprland >= 0.56): `windowrulev2` is gone — its handler only
# raises an error, so such rules are silently NEVER applied. Matchers moved from
# `prop:value` to `match:prop value`, and every field must carry a value.

# 1:Web — browser (everything-web window: gmail, chat, prefect, etc.)
windowrule = workspace 1 silent, match:class ^(chromium-browser)$
windowrule = workspace 1 silent, match:class ^(Chromium-browser)$
windowrule = workspace 1 silent, match:class ^(google-chrome)$
windowrule = workspace 1 silent, match:class ^(Google-chrome)$
windowrule = workspace 1 silent, match:class ^(firefox)$

# 2:Code — emacs (org-mode notes live here too)
windowrule = workspace 2 silent, match:class ^(emacs)$

# 5:All The Things — the all_the_things app under development
windowrule = workspace 5 silent, match:class ^(net\.mediaparadise\.AllTheThings)$
