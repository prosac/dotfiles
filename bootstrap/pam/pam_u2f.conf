# /etc/security/pam_u2f.conf
#
# Default module arguments for pam_u2f. This path is read automatically (the file
# is allowed not to exist), and options given on the PAM module line OVERRIDE
# whatever is set here.
#
# WHY this file rather than the PAM line: /etc/pam.d/system-auth is generated by
# authselect, and its `with-pam-u2f` feature emits a fixed `pam_u2f.so cue`.
# Any option hand-added to that line is silently dropped the next time authselect
# regenerates the file — which is exactly what happened on 2026-08-05, when
# `authselect disable-feature with-fingerprint` reverted the line and the previous
# `userverification` argument disappeared with it. Options declared here survive
# authselect regeneration.
#
# userverification=1 requires the authenticator to verify the *user*, not merely
# that someone is present: the on-key fingerprint sensor of the Kensington
# VeriMark Guard (047d:8055). Without it a bare touch authenticates, so mere
# possession of the key is sufficient. The enrolled credential in
# ~/.config/Yubico/u2f_keys carries the `+verification` flag, so it supports this.
#
# NB the previous PAM line used a bare `userverification` with no value. The
# documented syntax is `userverification=int`, and an omitted value falls back to
# "the authenticator's default behaviour" — so that form probably never enforced
# UV. State it explicitly.
#
# Install via:  mise run bootstrap:pam-u2f
# Safe to get wrong: pam_u2f is `sufficient` in system-auth, so a failure falls
# through to pam_unix (password). It cannot lock you out.

userverification = 1

# --- Temporary diagnostics, enabled 2026-08-20 -------------------------------
#
# WHY: an 8-day journal sample (58 locks) showed 55 of them cost at least one
# wasted submission, and ~25% cost two to four. The single-waste case is fully
# explained: hyprlock starts the PAM transaction at lock time, so pam_u2f's ~31s
# CTAP window is spent while nobody is there, and only a failed transaction makes
# hyprlock's retry loop re-arm the key. The MULTI-waste case is NOT explained.
# Two candidates, and pam_u2f is silent about both:
#
#   (a) touches lost to pam_unix's 2s delay-on-failure  — addressed by `nodelay`
#       in bootstrap/pam/hyprlock-fido2, same day
#   (b) fingerprint user-verification rejections — with userverification=1 a bad
#       read fails pam_u2f, which then falls through to a fresh password prompt.
#       To the user that is indistinguishable from "the key did nothing"
#
# `debug` distinguishes them. Do not guess which one it is; measure it.
#
# debug_file=syslog rather than a path: pam_u2f runs in the *calling* process, so
# for hyprlock that is uid 1000, which cannot write /var/log. pam-u2f also refuses
# to create a debug file itself (by design), so a path would need to pre-exist and
# be rotated. syslog lands in the journal next to the hyprlock/pam_unix lines the
# analysis already correlates against. Accepted values are a filename, "stdout",
# "stderr" (the default) or "syslog" — pam_u2f(8).
#
# ⚠️ SCOPE: this file is read by EVERY pam_u2f invocation — sudo, polkit, GDM, not
# just the lock screen. Expect verbose journal output on every privileged command.
# Deliberately not moved onto the hyprlock PAM module line instead: it is not
# established whether module args override this file per-option or wholesale, and
# guessing wrong would drop `userverification = 1` and let a bare touch (mere
# possession of the key) authenticate. A noisy journal is the cheaper mistake.
#
# TO REVERT once the question is settled: delete this block and re-run
# `mise run bootstrap:pam-u2f`. Nothing else depends on it.

debug
debug_file = syslog
