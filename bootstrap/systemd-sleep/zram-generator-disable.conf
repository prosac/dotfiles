# Disables zram entirely on this machine. Installed as
# /etc/systemd/zram-generator.conf, which REPLACES the [zram0] section shipped
# in /usr/lib/systemd/zram-generator.conf (standard systemd config precedence:
# same filename in /etc wins outright, it does not merge). No [zramN] section
# anywhere means the generator emits no units, so no zram device is created.
#
# This file is deliberately comments-only rather than truly empty. Fedora's own
# instruction is "create empty /etc/systemd/zram-generator.conf", and a
# comments-only file is empty as far as the parser is concerned -- but an empty
# file would tell the next reader nothing about why.
#
# ── Why ────────────────────────────────────────────────────────────────────
#
# zram is a sane Fedora-wide default and a poor fit for THIS machine. Its four
# real use cases are: low RAM (4-8 GB), slow storage (eMMC/SD/spinning rust),
# no disk swap configured at all, and meaningful SSD write-wear. This box has
# 61 GiB usable RAM, an NVMe with 24 queues, a 64 GiB swapfile, and a ~600 TBW
# 1 TB drive. None apply.
#
# Measured 2026-08-12, container workload up: pswpout 0 (not one page ever
# swapped out), zram0 DATA 4 KiB (just the swapon header), /proc/pressure/memory
# total 38 µs, 51 GiB available. It was pure ornament.
#
# ⚠️ And ornament with a cost: zram-generator gives zram swap-priority 100,
# while the disk swapfile sits at -1, so zram was FIRST IN LINE for every
# swap-out. That matters for hibernation. Before snapshotting, the kernel must
# free enough RAM to hold the image (/sys/power/image_size, ~24.7 GiB here), and
# it frees RAM by reclaiming anonymous pages -- into the highest-priority swap,
# which was RAM-backed. Pages got compressed and STAYED IN RAM: only the
# compression delta is freed, while zram allocates fresh RAM for its store. The
# suspected livelock behind the 2026-08-12 backpack incident, where a hibernate
# wedged and cooked the machine (see logind-10-lid-suspend.conf). Unproven --
# every kernel message after the freeze died with the power-off -- but removing
# zram fixes that phase structurally either way: reclaim now goes to NVMe and
# actually frees RAM. Hibernation is the only thing standing between a closed
# lid and a flat battery on this s2idle-only laptop, so it gets priority.
#
# Lowering zram's priority instead is not an option: swapon's pri= accepts only
# 0-32767, so it cannot go below the swapfile's -1. The alternative would be
# raising the swapfile above 100, which makes zram dead weight anyway.
#
# Post-removal swap is the 64 GiB swapfile alone, still >= 61 GiB RAM.
#
# To revert: delete this file, `systemctl daemon-reload`, and zram comes back
# from /usr/lib. The zram-generator-defaults package is left installed on
# purpose so reverting is one deletion.
#
# Installed by: mise run bootstrap:sleep
# See: ~/Documents/docs/zram-swap-tuning.md
