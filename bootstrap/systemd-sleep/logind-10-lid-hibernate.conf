# Lid close escalates to hibernate, so a closed laptop cannot drain to empty.
#
# This machine has NO deep/S3 sleep state — /sys/power/mem_sleep reads
# "[s2idle]" with no alternative — so a plain suspend keeps RAM powered and
# draws ~1 W. Against a 67.8 Wh battery that is a flat machine in under three
# days, which is exactly how three long weekends were lost (2026-07-23,
# 2026-07-31, 2026-08-06: each boot's journal ends on "PM: suspend entry
# (s2idle)" with no resume).
#
# On external power the lid does a plain suspend and stays there — a docked
# machine should stay instantly resumable.
#
# Installed by: mise run bootstrap:sleep
# See: ~/Documents/docs/suspend-then-hibernate-setup.md

[Login]
HandleLidSwitch=suspend-then-hibernate
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
