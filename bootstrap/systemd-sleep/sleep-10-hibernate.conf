# suspend-then-hibernate timing.
#
# Sit in s2idle for an hour so short breaks resume instantly, then write the
# hibernation image and drop to 0 W. At the measured s2idle draw that first
# hour costs roughly 2% of the battery.
#
# HibernateOnACPower= is only consulted when HibernateDelaySec= is set, so the
# two options belong together: without the explicit delay, systemd switches to
# battery-level estimation (ACPI _BTP alarms, falling back to periodic wakeups)
# and ignores the AC exemption entirely — a docked machine would eventually
# hibernate too. A fixed delay keeps the behaviour deterministic and does not
# depend on this TUXEDO's firmware implementing _BTP.
#
# Installed by: mise run bootstrap:sleep
# See: ~/Documents/docs/suspend-then-hibernate-setup.md

[Sleep]
HibernateDelaySec=60min
HibernateOnACPower=no
