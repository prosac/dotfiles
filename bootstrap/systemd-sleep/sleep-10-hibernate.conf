# suspend-then-hibernate timing — for a path nothing is supposed to take.
#
# ⚠️ As of 2026-08-12 no configured action invokes suspend-then-hibernate. The
# lid does a plain suspend (see logind-10-lid-suspend.conf for the backpack
# incident: the 60-minute self-wake wedged mid-hibernate inside a closed bag and
# cooked the machine for 44 minutes). hypridle only touches brightness, the lock
# screen and DPMS. So these two settings are inert, and they are kept anyway —
# deliberately — for two reasons.
#
# First, as a fallback that fails predictably: if anything ever does reach
# `systemctl suspend-then-hibernate`, a fixed delay is far better than the
# alternative. HibernateOnACPower= is only consulted when HibernateDelaySec= is
# set, so dropping the delay would not disable the escalation — it would switch
# systemd to battery-level estimation (ACPI _BTP alarms, falling back to
# periodic wakeups), ignore the AC exemption entirely, and make a docked machine
# hibernate too. Removing the timer makes the dangerous path less predictable,
# not less likely.
#
# Second, as the record of the decision. An empty drop-in would read as "never
# considered" rather than "tried, measured, and reversed for cause".
#
# Deliberate hibernation — `hibernate-now`, with a human watching — does not
# consult either option; plain `systemctl hibernate` writes the image at once.
#
# Installed by: mise run bootstrap:sleep
# See: ~/Documents/docs/suspend-then-hibernate-setup.md

[Sleep]
HibernateDelaySec=60min
HibernateOnACPower=no
