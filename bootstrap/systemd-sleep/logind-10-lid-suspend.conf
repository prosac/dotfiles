# Lid close does a plain suspend and nothing else. It never escalates.
#
# ⚠️ This deliberately reverses the 2026-08-11 suspend-then-hibernate setup.
# Read the incident before re-enabling it.
#
# 2026-08-12: the machine was closed at 09:03 and carried in a backpack. The
# lid handler worked exactly as designed — "Lid closed" → "Suspending, then
# hibernating..." → "PM: suspend entry (s2idle)". Sixty minutes later, sealed
# in the bag, HibernateDelaySec fired and the machine WOKE ITSELF UP to write
# the hibernation image:
#
#   10:03:17  System returned from sleep operation 'suspend-then-hibernate'
#   10:03:18  Performing sleep operation 'hibernate'...
#   10:03:18  kernel: PM: hibernation: hibernation entry
#   10:03:18  kernel: Freezing user space processes     <- journal ends here
#
# The hibernate wedged. No image was ever written — the next boot said
# "Unable to resume from device ... offset 12727697, continuing boot process."
# So the laptop sat at full power from 10:03 until it was pulled out at 10:47:
# 44 minutes with the vents against fabric and tccd frozen along with the rest
# of user space, because fan control is user space. It came out of the bag
# hotter than any laptop should ever be.
#
# Why the 2026-08-11 testing did not catch it: both successful hibernates that
# day (09:31, 18:55) ran from a fully awake desk session. The escalation path
# that suspend-then-hibernate actually uses in the field — s2idle, then wake,
# then immediately hibernate — ran for the very first time inside the backpack.
#
# The design is the defect, not just the wedge. suspend-then-hibernate wakes a
# sealed, unattended laptop to run the single most fragile operation in the
# kernel, at a moment when fan control, the thermal daemon and every watchdog
# are frozen and nobody is watching. There is nothing left that can catch a
# hang. A plain suspend has no such moment: it is terminal, and the machine
# only leaves it when a human opens the lid.
#
# The battery cost this gives back is real and accepted. There is no deep/S3
# state on this machine — /sys/power/mem_sleep reads "[s2idle]" with no
# alternative — so a closed lid still draws ~1 W and a 67.8 Wh battery still
# goes flat in under three days (2026-07-23, 2026-07-31, 2026-08-06). The
# trade: a flat battery loses unsaved work, a wedged hibernate in a bag cooks
# the hardware. Deliberate hibernation covers the flat-battery case instead —
# `hibernate-now`, bound to a key, run while standing over the machine and
# watching it power off. Being present is the whole point.
#
# Docked stays ignored: an external display should keep the session alive.
#
# Installed by: mise run bootstrap:sleep
# See: ~/Documents/docs/suspend-then-hibernate-setup.md

[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
