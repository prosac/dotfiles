# Baseline packages this dotfile setup assumes.
# Consumed by run_onchange_after_install-packages.sh.tmpl, which picks the
# right slice based on the host's Fedora version (templates can branch; data
# files cannot, since chezmoi loads .chezmoidata before the template engine).
#
# Two Fedora paths:
#   F43+ : walker/elephant come from the `errornointernet/walker` COPR.
#   F42  : that COPR has no F42 chroot. The install script rebuilds walker +
#          elephant SRPMs locally and needs the Rust/GTK4 + Go build toolchain.

elephantProviders:
  - desktopapplications
  - providerlist
  - calc
  - clipboard
  - files
  - runner
  - websearch
  - symbols
  - unicode
  - menus
  - bookmarks
  - snippets
  - bluetooth
  - windows

packages:
  # COPRs enabled on every Fedora.
  copr:
    - tofik/nwg-shell

  # COPRs enabled only on Fedora 43+ (no F42 chroot).
  coprF43Plus:
    # Hyprland itself, plus aquamarine and waypaper. This REPLACED
    # solopasha/hyprland in 2026-08; solopasha is explicitly disabled on this
    # host, and re-enabling it would put a second, unpinned Hyprland channel
    # ahead of this one. It moved out of the every-Fedora list above because
    # lionheartp has no F42 chroot -- fedora-42-x86_64 404s, 43 and 44 are live
    # -- and `enabled=1` on a COPR with no chroot for your release is a repo
    # that silently resolves nothing (skip_if_unavailable=True). On F42 there is
    # therefore no Hyprland COPR at all and Fedora's own package is what you get.
    #
    # ⚠️ This COPR runs AHEAD of upstream and garbage-collects old builds, so an
    # upgrade can move Hyprland out from under the plugins -- which are ABI-pinned
    # per build and fail to load SILENTLY, with no failed unit and no error. The
    # includepkgs pin below bounds WHICH packages come from here; it does nothing
    # about WHICH VERSION. Check hyprland-devel before a compositor upgrade.
    - lionheartp/Hyprland
    - errornointernet/walker
    # DankMaterialShell (the "Hyprland (DMS)" session — see PLAYBOOK.md).
    # danklinux ships quickshell 0.3.x (Terra only has 0.2.1, too old for
    # Quickshell.Networking/Bluetooth/Services.Polkit that DMS needs);
    # dms ships dms + dms-cli + dgop.
    - avengemedia/danklinux
    - avengemedia/dms

  # Packages this host must never install, applied as a global dnf
  # `excludepkgs`. Global rather than per-repo because a package can be
  # reachable from more than one repo (matugen is in both Terra and the
  # danklinux COPR), and a weak dependency will happily pull it from
  # whichever one is left.
  #
  # matugen: DMS ships wallpaper-derived Material 3 theming and every template
  # flag defaults to ON (matugenTemplateGtk / Hyprland / Ghostty / Qt6ct /
  # Emacs / Vscode ...). That is exactly the territory toggle-color-scheme owns
  # as the single source of truth, and several of those templates write files
  # chezmoi manages — so it would cause drift in the DEFAULT session too, not
  # just in the DMS one. DMS only `Recommends:` it, so excluding it costs
  # nothing. Belt-and-braces: the DMS settings seed also sets
  # runDmsMatugenTemplates/runUserMatugenTemplates to false.
  dnfExclude:
    - matugen

  # Persistent per-repo dnf option overrides, applied after the COPRs are
  # enabled. `dnf config-manager setopt` writes these to
  # /etc/dnf/repos.override.d/, NOT into the .repo files themselves, so they
  # survive updates of the packages that own those files (e.g. terra-release).
  #
  # terra.excludepkgs=quickshell*: Terra and the danklinux COPR both ship
  # quickshell (0.2.1 vs 0.3.0). dnf picks the higher version, so DMS works
  # today by luck; if Terra ever ships a newer quickshell than the COPR, DMS
  # would silently get an untested toolkit. Pinning the source makes a bad
  # upgrade a loud install failure instead of a silent breakage.
  #
  # copr:...:lionheartp:Hyprland.includepkgs=...: that COPR builds a great deal
  # more than Hyprland, and without a pin a weak dependency can pull an
  # arbitrary package out of it in preference to Fedora's or Terra's build. The
  # allowlist is exactly what this host takes from it, verified against the
  # installed set: hyprland, hyprland-uwsm, hypr{cursor,graphics,lang,utils,
  # wayland-scanner,wire}*, aquamarine(-devel), glaze-devel, waypaper.
  #
  # Dropping solopasha strands nothing: the only two packages still attributed
  # to it here, python3-imageio-ffmpeg and python3-screeninfo, are both in
  # Terra 43.
  #
  # NB the repoid contains dots and colons and is still parsed correctly --
  # `dnf config-manager setopt` splits on the LAST dot before `=`. It also
  # resolves the repoid to concrete repos at write time, so it must run AFTER
  # the COPRs are enabled (the template already orders it that way).
  repoOverridesF43Plus:
    - terra.excludepkgs=quickshell*
    - "copr:copr.fedorainfracloud.org:lionheartp:Hyprland.includepkgs=hypr*,aquamarine,aquamarine-devel,xdg-desktop-portal-hyprland,waypaper,glaze-devel"

  # dnf packages installed on every Fedora.
  dnf:
    # Core
    - git
    - zsh
    - vim-enhanced
    - fzf
    - ripgrep
    - btrfs-progs
    - flatpak

    # chezmoi pipeline
    - gitleaks
    - pre-commit

    # Hyprland WM (lionheartp/Hyprland on F43+; Fedora's own build on F42)
    #
    # hyprpaper is deliberately ABSENT. The wallpaper stack is awww driven by
    # waypaper through waypaper's native awww backend -- see awww.service
    # + waypaper.service and hyprland.conf.tmpl. Installing hyprpaper as well
    # would put a second wallpaper daemon on the machine with nothing enabling
    # it. It stays installed on hosts that already have it; dnf only adds.
    - hyprland
    # Headers for the hyprtasking plugin (Super+Tab overview), built by
    # ~/.local/bin/hyprtasking-rebuild. Hyprland plugins are ABI-pinned to the
    # exact compositor build, so this MUST stay at the same version as hyprland
    # -- the rebuild script refuses to build on a mismatch rather than produce a
    # .so that crashes the compositor on load. Both come from the same COPR and
    # the `hypr*` includepkgs pin already covers it, so dnf keeps them in step.
    #
    # Without it a fresh machine cannot build the plugin at all, and the only
    # symptom is Hyprland's on-screen Error Overlay reporting
    # `hyprtasking:toggle` as an invalid dispatcher -- three steps removed from
    # "a -devel package is missing". That is how this machine came up on
    # 2026-09-02.
    - hyprland-devel
    - hypridle
    - hyprlock
    - waybar

    # Wallpaper daemon. Terra's awww carries `Obsoletes: swww < 0.11.2-2` without
    # a matching `Provides: swww`, so there is simply no swww binary on the host.
    # awww.service execs /usr/bin/awww-daemon directly and waypaper drives it via
    # `backend = awww`; no /usr/local/bin shims are involved, and none are needed.
    # The picker itself (waypaper) is F43+ only, below.
    - awww

    # niri WM — scrollable-tiling alternative session (Fedora repo, no COPR).
    # Ships niri-session + /usr/share/wayland-sessions/niri.desktop, so "Niri"
    # appears at GDM automatically. xwayland-satellite (pulled in as a dep)
    # provides XWayland. hyprlock/hypridle/waybar/awww/etc. are shared with the
    # Hyprland session — see dot_config/niri/ and the systemd user services.
    - niri

    # Display tools (tofik/nwg-shell)
    - nwg-displays

    # GTK theme build deps — the Graphite-teal-nord theme that
    # toggle-color-scheme selects is not packaged for Fedora; it is built from
    # source by run_onchange_after_zz-install-gtk-theme.sh, which needs these.
    #
    # `gnome-themes-extra` was dropped from this list on 2026-09-01: Fedora 44
    # no longer ships it (it went with the GTK2 stack, and nothing Provides it),
    # so `dnf install` could not resolve the transaction at all on F44. It was
    # never needed regardless — upstream's install.sh requires only sassc, and
    # it drives sassc over gnome-shell/gtk-3.0/gtk-4.0 sources; there is no GTK2
    # leg in the build for a gtk2 engine to serve.
    - sassc
    - gtk-murrine-engine

    # System integration / tray / auth
    - blueman
    - mate-polkit
    - network-manager-applet
    - pavucontrol

    # Elephant runtime recommends (used by selected providers)
    - bluez
    - fd-find
    - libnotify
    - qalculate-gtk
    - wl-clipboard

  # Mail stack — installed only when `mailSetup = true` in chezmoi.toml.
  # The install-packages script gates this slice; .chezmoidata can't branch
  # on chezmoi data itself, so the conditional lives in the consumer.
  #
  # lieer pulls in `notmuch2` from PyPI, whose sdist is broken on Fedora
  # (missing version.txt at build time). Fedora ships a working binding as
  # python3-notmuch2; the run_onchange_after_post-install-lieer.sh.tmpl hook
  # creates a uv venv with --system-site-packages so lieer can import it.
  # gmime30 (gmime 3.x runtime) is pulled in by notmuch automatically.
  # jq is used by ~/.local/bin/mail-sync to detect refresh-token rotation.
  dnfMail:
    - notmuch
    - python3-notmuch2
    - w3m
    - jq

  # Fedora 43+ only — installed straight from the walker COPR.
  # elephant-<provider> packages are added by the install script from
  # `elephantProviders` above.
  dnfF43Plus:
    - walker
    - elephant

    # Hyprland's Qt/QML helper binaries: hyprland-dialog, hyprland-update-screen,
    # hyprland-welcome, hyprland-run. Hyprland calls these for anything it cannot
    # draw itself -- notably the DynamicPermissionManager's permission prompts --
    # and it CHECKS FOR THEM AT STARTUP, so on a machine without them every single
    # login opens with an on-screen warning:
    #
    #   Your system does not have hyprland-guiutils installed. This is a runtime
    #   dependency for some dialogs. Consider installing it.
    #
    # Renamed upstream from hyprland-qtutils, which is why searching for the old
    # name finds nothing. Only `Recommends:`ed by hyprland, so dnf will not pull
    # it in on its own.
    #
    # The alternative is `misc:disable_hyprland_guiutils_check = true` in
    # hyprland.conf, which silences the warning and leaves the dialogs unable to
    # appear -- fine for a headless box, wrong for this one.
    #
    # F43+ because lionheartp/Hyprland is the only repo that carries it (no
    # Fedora, no Terra build) and that COPR has no F42 chroot. Already allowed by
    # that COPR's `hypr*` includepkgs pin.
    - hyprland-guiutils

    # Wallpaper picker (Super+W), and the other half of the awww pairing above.
    # F43+ because lionheartp/Hyprland is the ONLY repo that carries it -- it is
    # in no Fedora or Terra channel -- and that COPR has no F42 chroot. It is
    # named explicitly in that COPR's includepkgs pin for the same reason.
    - waypaper

    # DankMaterialShell — the Quickshell desktop used by the "Hyprland (DMS)"
    # session only. Installing these changes nothing for the default Hyprland
    # or niri sessions: dms.service is persistently disabled (see the
    # `bootstrap:dms-session` mise task) and only runtime-enabled by
    # ~/.local/bin/hyprland-dms.
    #
    # `matugen` is deliberately NOT here, and is globally excluded below.
    - dms
    - dms-cli
    - dgop
    - quickshell
    - material-symbols-fonts

  # Fedora 42 only — SRPM rebuild toolchain (the rebuild itself runs in
  # run_onchange_after_install-packages.sh.tmpl).
  dnfF42:
    # Rebuild infrastructure
    - rpm-build
    - rpmdevtools
    # Walker (Rust, GTK4)
    - cargo
    - cargo-rpm-macros
    - rust
    - rustfmt
    - protobuf-compiler
    - gtk4-devel
    - gtk4-layer-shell-devel
    - cairo-gobject-devel
    - pango-devel
    - poppler-glib-devel
    - gdk-pixbuf2-devel
    - graphene-devel
    - glib2-devel
    # Elephant (Go)
    - golang
    - go-rpm-macros
    - kando
    - wayland-devel
